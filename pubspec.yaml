name: foldable_devices_ui
description: Adaptive Flutter UI widgets and controllers for foldable devices, including iPhone Duo SafeArea, native toolbar actions, vertical navigation, and hinge-angle split layouts.
version: 0.1.0
repository: https://github.com/pochipochi-tsudoi/foldable_devices_ui
issue_tracker: https://github.com/pochipochi-tsudoi/foldable_devices_ui/issues
topics:
  - foldable
  - ui
  - layout
  - adaptive
  - navigation

environment:
  sdk: ^3.13.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_ui: ^1.1.0
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.pochipochi_tsudoi.foldable_devices_ui
        pluginClass: FoldableDevicesUiPlugin
      ios:
        pluginClass: FoldableDevicesUiPlugin
